# CS ELECTRONICS TOOLS
- type: entity
  parent: BaseItem
  id: ElectronicDetectorT1
  name: basic electronics toolkit
  description: A basic kit with the bare minimum of tools to service electronic machines. The specialized tools aren't good for rougher work.
  suffix: Stalker, Detector
  components:
  - type: STWeight
    self: 4
  - type: Item
    size: Normal
    shape:
    - 0,0,1,1
  - type: Sprite
    sprite: _Stalker_EN/Objects/Tools/cstool1.rsi
    state: icon
  - type: ElectronicsTool
    searchTime: 15 # ST:OW
    probability: 0.30 # ST:OW
    # ST:OW begin
    rollsMin: 1
    rollsMax: 2
    rollsHardCap: 2
    # ST:OW end
  - type: RepositoryItem
    categoryName: repository-tools-category

- type: entity
  parent: BaseItem
  id: ElectronicDetectorT2
  name: advanced electronics multitool
  description: A compact and intricate tool designed to extract electronic parts. Without instructions it's a little hard for the average person to use it efficiently.
  suffix: Stalker, Detector
  components:
  - type: STWeight
    self: 2
  - type: Item
    size: Small
    shape:
    - 0,0,0,1
  - type: Sprite
    sprite: _Stalker_EN/Objects/Tools/cstool2.rsi
    state: icon
    scale: 0.7, 0.7
  - type: ElectronicsTool
    searchTime: 25 # ST:OW
    probability: 0.80
    # ST:OW begin
    rollsMin: 1
    rollsMax: 3
    rollsHardCap: 3
    # ST:OW end
  - type: RepositoryItem
    categoryName: repository-tools-category

- type: entity
  id: RandomElectronicsToolSpawner
  name: random electronics spawner (electronics tool)
  suffix: Stalker
  parent: FlexibleMarker
  components:
  - type: Sprite
    sprite: _Stalker/Objects/Other/Boxes/green_crate.rsi
    state: icon
  - type: RandomSpawner
    prototypes:
    # ST:OW begin
      # Common salvage
      - STJunkHardDriveBroken
      
      # T1
      - STCraftBasicPCBT1
      - STCraftGlassT1
      - STCraftSheetCopperT1
      
      # T2
      - STCraftSheetIronT2
      - STCraftGlassT2
      - STCraftStandardPCBT2
      
      # Electronics
      - STCraftBattery
      - STCraftCoil
      - STCraftCapacitor
      - STCraftTransformer
      
    rarePrototypes:
      - STJunkHardDrive
      
      # T3
      - STCraftQuartzCrystalT3
      - STCraftSheetBrassT3
      - STCraftMultilayerPCBT3
    rareChance: 0.08 # 8%

    epicPrototypes:
      # T4
      - STCraftHighPerformanceChipT4
      - STCraftSheetAluminumT4
      - STCraftSapphireCrystalT4
    epicChance: 0.005 # 0.5%
    
    legendaryPrototypes:
      # T5
      - STCraftNanoChipT5
      - STCraftSheetSteelT5
      - STCraftAluminumOxideT5

    legendaryChance: 0.0015 # 0.15% (about 1 in 667 successful spawns)
    # ST:OW end
    chance: 1
    offset: 0.5
